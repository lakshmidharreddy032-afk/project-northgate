name: Build & Deploy Project Northgate to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGION: asia-south1
  ARTIFACT_REPO: northgate

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run pytest suite
        run: pytest backend/tests/ -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build & typecheck frontend
        working-directory: frontend
        run: npm ci && npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend and frontend Docker images
        run: |
          docker build -t northgate-backend:ci ./backend
          docker build --build-arg VITE_API_URL=http://localhost:8000 -t northgate-frontend:ci ./frontend
      - name: Smoke-test running Docker containers
        run: |
          docker run -d --name northgate-backend -p 8000:8080 -e PORT=8080 northgate-backend:ci
          docker run -d --name northgate-frontend -p 3000:8080 northgate-frontend:ci
          sleep 4
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/api/cases | grep -q "CASE-2024-8841"
          curl -fsS http://127.0.0.1:3000/ | grep -q "Project Northgate"
          docker rm -f northgate-backend northgate-frontend

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check if GCP secrets are configured
        id: check
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [[ -n "$WIF_PROVIDER" && -n "$GCP_SA" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping GCP Cloud Run deployment: add GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT secrets (with GCP billing enabled) to activate Cloud Run deploy."
          fi
      - id: auth
        if: steps.check.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - if: steps.check.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ steps.auth.outputs.project_id }}
      - name: Configure Docker for Artifact Registry
        if: steps.check.outputs.configured == 'true'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
      - name: Ensure Artifact Registry repository exists
        if: steps.check.outputs.configured == 'true'
        run: |
          gcloud artifacts repositories describe ${{ env.ARTIFACT_REPO }} \
            --location=${{ env.REGION }} --project=${{ steps.auth.outputs.project_id }} || \
          gcloud artifacts repositories create ${{ env.ARTIFACT_REPO }} \
            --repository-format=docker --location=${{ env.REGION }} \
            --project=${{ steps.auth.outputs.project_id }}
      - name: Build and push backend image to GCP
        if: steps.check.outputs.configured == 'true'
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
      - name: Deploy backend to Cloud Run
        id: deploy-backend
        if: steps.check.outputs.configured == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: northgate-backend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.ARTIFACT_REPO }}/backend:${{ github.sha }}
          flags: '--allow-unauthenticated --port=8080'
      - name: Build and push frontend image to GCP
        if: steps.check.outputs.configured == 'true'
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
          docker build --build-arg VITE_API_URL=${{ steps.deploy-backend.outputs.url }} -t "$IMAGE" ./frontend
          docker push "$IMAGE"
      - name: Deploy frontend to Cloud Run
        if: steps.check.outputs.configured == 'true'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: northgate-frontend
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ steps.auth.outputs.project_id }}/${{ env.ARTIFACT_REPO }}/frontend:${{ github.sha }}
          flags: '--allow-unauthenticated --port=8080'
